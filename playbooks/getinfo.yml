---
- name: Check Ansible and Execution Environment Versions
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Get ansible version details
      ansible.builtin.command: ansible --version
      register: ansible_version_output

    - name: Display the version output
      ansible.builtin.debug:
        msg: "{{ ansible_version_output.stdout_lines }}"
    
    - name: Get ansible collection details
      ansible.builtin.command: ansible-galaxy collection list
      register: ansible_collection_output

    - name: Display the collection output
      ansible.builtin.debug:
        msg: "{{ ansible_collection_output.stdout_lines }}"