---
- name: drill on how to use the password lookup module
  hosts: localhost
  vars:
    env_var: "{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') }}"
  tasks:
  - name: generate password on the tower host
    copy:
      dest: /tmp/db-pass.txt
      content: "{{ lookup('ansible.builtin.password', '/dev/null', length=20, chars=['ascii_letters','digits']) }}"
      force: false
      mode: '0600'
    delegate_to: tower
  - name: read the generate password.
    slurp:
      src: /tmp/db-pass.txt
    register: password_raw
    delegate_to: tower
  - name: set the password
    set_fact:
      password: "{{ (password_raw.content | b64decode).strip() }}"
  - name: show created password.
    debug:
      var: password
  - name: show environment variable
    debug:
      var: env_var
  - name: copy the two variables to a file
    template:
      dest: /tmp/app-config.txt
      src: templates/secret.j2
    delegate_to: tower